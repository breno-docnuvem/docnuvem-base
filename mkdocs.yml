site_name: Docnuvem — Documentação
site_description: Manual do Sistema, Central de Ajuda e Base de Conhecimento Interna do Docnuvem
site_url: https://breno-docnuvem.github.io/docnuvem-base/
repo_url: https://github.com/breno-docnuvem/docnuvem-base
repo_name: docnuvem-base
docs_dir: docs

theme:
  name: material
  language: pt
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - Manual do Sistema:
      - Visão geral: manual/index.md
      - Antes de começar: manual/01-antes-de-comecar.md
      - Acessando o Sistema: manual/02-acessando-o-sistema.md
      - Dashboard: manual/03-dashboard.md
      - Meus Documentos: manual/04-meus-documentos.md
      - Busca Avançada: manual/05-busca-avancada.md
      - Notificações: manual/06-notificacoes.md
      - Meus Cadastros: manual/07-meus-cadastros.md
      - Meus Modelos: manual/08-meus-modelos.md
      - Tipos Cadastrados: manual/09-tipos-cadastrados.md
      - Arquivos: manual/10-arquivos.md
      - Módulo de Tarefas: manual/11-modulo-de-tarefas.md
      - Auditoria: manual/12-auditoria.md
      - Lixeira: manual/13-lixeira.md
      - Relatórios: manual/14-relatorios.md
      - Assistente IADoc: manual/15-assistente-iadoc.md
      - Perguntas Frequentes: manual/16-perguntas-frequentes.md
  - Central de Ajuda:
      - Visão geral: central-de-ajuda/index.md
      - Visão geral do sistema: central-de-ajuda/visao-geral.md
      - Fluxos essenciais: central-de-ajuda/fluxos-essenciais.md
      - Diagnóstico e troubleshooting: central-de-ajuda/diagnostico-troubleshooting.md
      - Perguntas frequentes: central-de-ajuda/faq.md
      - Glossário: central-de-ajuda/glossario.md
  - Base de Conhecimento Interna:
      - Visão geral: base-de-conhecimento/index.md
      - Plano de contingência: base-de-conhecimento/contingencia.md
      - Implantação:
          - Visão geral do processo: base-de-conhecimento/implantacao/index.md
          - 1. Início do processo: base-de-conhecimento/implantacao/01-inicio-do-processo.md
          - Configuração inicial da instância:
              - 2. Configurações da empresa: base-de-conhecimento/implantacao/02-configuracoes-da-empresa.md
              - 3. Outras configurações: base-de-conhecimento/implantacao/03-outras-configuracoes.md
              - 4. Configurações avançado: base-de-conhecimento/implantacao/04-configuracoes-avancado.md
              - 5. Funcionalidades Enterprise: base-de-conhecimento/implantacao/05-funcionalidades-enterprise.md
              - 6. Cadastro do primeiro usuário: base-de-conhecimento/implantacao/06-cadastro-do-primeiro-usuario.md
          - Primeiro contato com o cliente:
              - 7. Cadastro do contato no Digisac: base-de-conhecimento/implantacao/07-cadastro-do-contato-no-digisac.md
              - 8. Script de primeiro contato: base-de-conhecimento/implantacao/08-script-de-primeiro-contato.md
              - 9. Identidade visual: base-de-conhecimento/implantacao/09-identidade-visual.md
              - 10. Envio da playlist (Standard): base-de-conhecimento/implantacao/10-envio-da-playlist-standard.md
          - Configuração dos itens contratados e treinamento:
              - 11. Solicitação de modelos de documentos: base-de-conhecimento/implantacao/11-solicitacao-modelos-documentos.md
              - 12. Cadastro de empresas e diretórios: base-de-conhecimento/implantacao/12-cadastro-de-empresas-e-diretorios.md
              - 13. Agendamento do treinamento: base-de-conhecimento/implantacao/13-agendamento-do-treinamento.md
              - 14. Envio da gravação do treinamento: base-de-conhecimento/implantacao/14-envio-da-gravacao-do-treinamento.md
              - 15. Solicitação do envio inteligente: base-de-conhecimento/implantacao/15-solicitacao-do-envio-inteligente.md
              - 16. Finalização da implantação: base-de-conhecimento/implantacao/16-finalizacao-da-implantacao.md
      - Suporte:
          - Visão geral: base-de-conhecimento/suporte/index.md
          - Agente Docnuvem (robô):
