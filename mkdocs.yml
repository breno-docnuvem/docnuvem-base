              - 2. Quando instalar o Agente Docnuvem: base-de-conhecimento/suporte/agente-docnuvem/02-quando-instalar-o-agente-docnuvem.md
              - Instalação:
                  - 3. Baixar e alocar os arquivos: base-de-conhecimento/suporte/agente-docnuvem/03-baixar-e-alocar-os-arquivos.md
                  - 4. Configurar o default.properties: base-de-conhecimento/suporte/agente-docnuvem/04-configurar-o-default-properties.md
              - Depois de instalado:
                  - 5. Rodar como programa convencional: base-de-conhecimento/suporte/agente-docnuvem/05-rodar-como-programa-convencional.md
                  - 6. Instalar como serviço do Windows: base-de-conhecimento/suporte/agente-docnuvem/06-instalar-como-servico-do-windows.md
          - Sincronizador Docnuvem:
